<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZIVARA | Online Fashion Store</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#fff8fb;
    color:#333;
}

header{
    background:linear-gradient(135deg,#68153e,#a52a68);
    color:white;
    text-align:center;
    padding:35px 15px;
}

header h1{
    font-size:44px;
    letter-spacing:4px;
}

header p{
    margin-top:6px;
}

nav{
    background:white;
    padding:15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 10px #0002;
}

nav a{
    color:#7b1e4b;
    text-decoration:none;
    font-weight:bold;
    margin:0 9px;
    font-size:14px;
}

.hero{
    text-align:center;
    padding:55px 20px;
    background:#fff0f6;
}

.hero h2{
    color:#7b1e4b;
    font-size:32px;
    margin-bottom:10px;
}

.hero p{
    max-width:650px;
    margin:auto;
    font-size:17px;
}

.section{
    max-width:1200px;
    margin:auto;
    padding:45px 15px;
}

.title{
    text-align:center;
    color:#7b1e4b;
    font-size:30px;
    margin-bottom:30px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.product{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px #0002;
}

.gallery{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:thin;
}

.gallery img{
    min-width:100%;
    width:100%;
    height:390px;
    object-fit:cover;
